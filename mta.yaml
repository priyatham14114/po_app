_schema-version: 3.3.0
ID: po_app
description: A simple CAP project.
version: 1.0.0
modules:
- name: po_app-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: po_app-auth
  - name: po_app-db
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: po_app-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: po_app-db
  parameters:
    buildpack: nodejs_buildpack
- name: po_app-app-deployer
  type: com.sap.application.content
  path: gen
  requires:
  - name: po_app-auth
  - name: srv-api
  - name: po_app-html5-repo-host
    parameters:
      config:
        HTML5Runtime_enabled: true
      content-target: true
  build-parameters:
    build-result: app/
    requires:
    - artifacts:
      - comapppoapplication.zip
      name: comapppoapplication
      target-path: app/
- name: comapppoapplication
  type: html5
  path: app/po_application
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: po_app-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      tenant-mode: dedicated
      xsappname: po_app-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: po_app-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: po_app-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
- name: po_app-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: po_app-destination-service
    service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
